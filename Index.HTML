<style>
  :root{
    --bg: #EEF3EC;
    --paper: #F7FAF6;

    margin: 0 auto;

    padding: 28px 0;

    align-items: baseline;
  }

    font-size: 1.25rem;
    letter-spacing: 0.01em;
  }
